services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: confluence-rag-postgres
    environment:
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langchain
      POSTGRES_DB: langchain
    ports:
      - "6024:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
